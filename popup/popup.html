<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colorize UI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="../icons/icon48.png" alt="" width="28" height="28" />
        <div>
          <h1>Colorize UI</h1>
          <p class="subtitle">環境を色で区別</p>
        </div>
      </div>
      <label class="switch" title="拡張機能の有効/無効">
        <input id="enabled" type="checkbox" />
        <span class="slider"></span>
      </label>
    </header>

    <section class="status" id="status">
      <div class="swatch" id="swatch" hidden></div>
      <div class="status-text">
        <strong id="status-title">判定中…</strong>
        <span id="status-detail"></span>
      </div>
    </section>

    <section class="section">
      <label class="field">
        <span>監視ドメイン（1行1ドメイン）</span>
        <textarea
          id="domains"
          rows="3"
          placeholder="空欄 = 全ドメイン&#10;example.com&#10;myapp.internal"
        ></textarea>
      </label>
      <p class="hint">指定したドメイン配下で、hostname に dev / stg などがあれば色を付けます。</p>
    </section>

    <section class="section checks">
      <label><input id="show-banner" type="checkbox" /> バナー表示</label>
      <label><input id="show-border" type="checkbox" /> 枠線表示</label>
    </section>

    <footer class="footer">
      <button id="save" class="primary" type="button">保存</button>
      <button id="open-options" type="button">詳細設定</button>
    </footer>

    <p id="toast" class="toast" hidden>保存しました</p>
    <script src="../shared/defaults.js"></script>
    <script src="../shared/matcher.js"></script>
    <script src="../shared/storage.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
